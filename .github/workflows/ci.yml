name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  checks: write

jobs:
  shared:
    permissions:
      contents: read
      checks: write
    uses: ./.github/workflows/rust-ci.yml
    with:
      binary-name: xfer
      display-name: XFER
      environment-prefix: XFER
    secrets:
      dependency_token: ${{ secrets.RUST_CLI_TOOLKIT_TOKEN }}
