name: CI
on:
  workflow_call:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.17.0
      - uses: actions/setup-python@v7
        with:
          python-version: '3.x'
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.0'
      - run: bun install --frozen-lockfile
        working-directory: web
      - run: bun run build
        working-directory: web
      - run: bun run check
        working-directory: web
      - run: bun tests/ui.js
      - name: LAN benchmark harness regressions
        if: runner.os != 'Windows'
        run: python tests/benchmark.py
      - run: zig fmt --check build.zig src
      - run: zig build test
      - run: zig build -Doptimize=ReleaseSafe
      - name: Network integration
        shell: bash
        run: python tests/integration.py zig-out/bin/xfer${{ runner.os == 'Windows' && '.exe' || '' }}
      - name: Browser workflow integration
        shell: bash
        run: python tests/desktop.py zig-out/bin/xfer${{ runner.os == 'Windows' && '.exe' || '' }}
      - name: Single executable isolation
        shell: bash
        run: python tests/standalone.py zig-out/bin/xfer${{ runner.os == 'Windows' && '.exe' || '' }}
      - name: Install browser
        if: runner.os == 'Linux'
        working-directory: web
        run: bunx --no-install playwright install --with-deps chromium
      - name: Real browser transfer
        if: runner.os == 'Linux'
        working-directory: web
        run: bun scripts/browser.ts ../zig-out/bin/xfer
  cross:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        target: [x86_64-linux-musl, aarch64-linux-musl, x86_64-macos, aarch64-macos, x86_64-windows, aarch64-windows]
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.17.0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.0'
      - run: zig build -Dtarget=${{ matrix.target }} -Doptimize=ReleaseSafe
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.17.0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.0'
      - uses: actions/setup-python@v7
        with:
          python-version: '3.x'
      - run: python scripts/package.py
      - uses: actions/upload-artifact@v4
        with:
          name: release-packages
          path: dist/
