# Local XFER CLI and desktop validation.
name: Reusable Rust CLI CI

on:
  workflow_call:
    inputs:
      binary-name:
        required: true
        type: string
      display-name:
        required: true
        type: string
      environment-prefix:
        required: true
        type: string
      run-installer-tests:
        required: false
        default: true
        type: boolean

permissions:
  contents: read

jobs:
  quality:
    name: Quality
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy,rustfmt
      - uses: Swatinem/rust-cache@v2.9.1
        with:
          prefix-key: v1-rust
          shared-key: ci-${{ github.repository_id }}-quality
          key: ${{ runner.os }}
          cache-bin: false
          cache-on-failure: false
          save-if: ${{ github.event_name == 'push' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}
      - run: cargo fmt --all -- --check
      - run: cargo clippy --locked --all-targets --all-features -- -D warnings
      - run: cargo test --locked --all-targets
      - run: cargo test --locked --no-default-features --lib
      - name: Release and packaging regression tests
        run: |
          python3 tests/render-installers.py
          python3 tests/release-version.py
          python3 tests/package-desktop.py

  security:
    name: RustSec audit
    permissions:
      contents: read
      checks: write
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: rustsec/audit-check@v2.0.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

  native:
    name: Test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2.9.1
        with:
          prefix-key: v1-rust
          shared-key: ci-${{ github.repository_id }}-native
          key: ${{ runner.os }}
          cache-bin: false
          cache-on-failure: false
          save-if: ${{ github.event_name == 'push' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}
      - run: cargo test --locked --all-targets

  installers:
    if: inputs.run-installer-tests
    name: Installer rendering (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Render installers
        shell: bash
        run: python3 scripts/render-installers.py --binary xfer --display-name XFER --repository '${{ github.repository }}' --environment-prefix XFER --output '${{ runner.temp }}/installers'
      - name: Installer regression tests
        if: runner.os != 'Windows'
        run: sh tests/install-sh.sh
      - name: Validate POSIX installer
        if: runner.os != 'Windows'
        shell: sh
        run: |
          sh -n "$RUNNER_TEMP/installers/install.sh"
          XFER_INSTALLER_SOURCE_ONLY=1
          export XFER_INSTALLER_SOURCE_ONLY
          . "$RUNNER_TEMP/installers/install.sh"
          test "$PROGRAM" = '${{ inputs.binary-name }}'
          test "$ENV_PREFIX" = '${{ inputs.environment-prefix }}'
          test "$(artifact_for Linux x86_64 gnu)" = '${{ inputs.binary-name }}-linux-x86_64'
      - name: Validate PowerShell installer
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          RENDERED_INSTALLER: ${{ runner.temp }}/installers/install.ps1
        run: |
          $sourceOnly = '${{ inputs.environment-prefix }}_INSTALLER_SOURCE_ONLY'
          [Environment]::SetEnvironmentVariable($sourceOnly, '1')
          . $env:RENDERED_INSTALLER
          if ((Get-CliArtifact 'AMD64') -ne '${{ inputs.binary-name }}-windows-x86_64.exe') { throw 'x86_64 artifact mismatch' }
          if ((Get-CliArtifact 'ARM64') -ne '${{ inputs.binary-name }}-windows-aarch64.exe') { throw 'ARM64 artifact mismatch' }

  cross-check:
    name: Check ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        target:
          - x86_64-unknown-linux-musl
          - aarch64-unknown-linux-gnu
          - aarch64-unknown-linux-musl
          - x86_64-pc-windows-msvc
          - aarch64-pc-windows-msvc
          - x86_64-apple-darwin
          - aarch64-apple-darwin
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2.9.1
        with:
          prefix-key: v1-rust
          shared-key: ci-${{ github.repository_id }}-cross-check-${{ matrix.target }}
          cache-bin: false
          cache-on-failure: false
          save-if: ${{ github.event_name == 'push' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}
      - run: cargo check --locked --target ${{ matrix.target }}

  desktop:
    name: Desktop (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - name: Linux desktop libraries
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev libfontconfig1-dev libfreetype6-dev libwayland-dev libxkbcommon-dev libxkbcommon-x11-dev libssl-dev libxcb1-dev libclang-dev clang cmake
      - name: Metal compiler
        if: runner.os == 'macOS'
        run: xcrun metal --version || xcodebuild -downloadComponent MetalToolchain
      - uses: Swatinem/rust-cache@v2.9.1
        with:
          shared-key: ci-desktop-${{ runner.os }}
      - run: cargo clippy --locked -p xfer-desktop --all-targets -- -D warnings
      - run: cargo test --locked -p xfer-desktop --features test-support
      - run: cargo build --locked -p xfer-desktop
      - name: CLI dependency isolation
        shell: bash
        run: '! cargo tree --locked -p xfer | grep -E "gpui|fs2|ratatui|crossterm|indicatif"'
