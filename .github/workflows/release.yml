name: Release
on:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  verify:
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read
  package:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.17.0
      - uses: actions/setup-python@v7
        with:
          python-version: '3.x'
      - name: Check tag and package all targets
        run: |
          test "$GITHUB_REF_NAME" = "v$(cat VERSION)"
          python scripts/package.py
      - name: Publish verified artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" "dist/$(cat VERSION)/"* --verify-tag --title "XFER $GITHUB_REF_NAME" --generate-notes
