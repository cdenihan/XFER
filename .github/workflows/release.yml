name: Release
on:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  verify:
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read
  publish:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/download-artifact@v4
        with:
          name: release-packages
          path: dist/
      - name: Check tag
        run: |
          test "$GITHUB_REF_NAME" = "v$(cat VERSION)"
      - name: Publish verified artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" "dist/$(cat VERSION)/"* --verify-tag --title "XFER $GITHUB_REF_NAME" --generate-notes
