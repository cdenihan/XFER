[package]
name = "xfer"
version = "2026.9.6-1"
edition = "2024"
rust-version = "1.89"
description = "Secure, cross-platform file and directory transfer for local networks"
repository = "https://github.com/cdenihan/XFER"
readme = "README.md"
keywords = ["file-transfer", "lan", "encryption", "cli", "gui"]
categories = ["command-line-utilities", "network-programming"]
publish = false

[dependencies]
chacha20poly1305 = "0.11"
clap = { optional = true, version = "4.6", features = ["derive", "env", "wrap_help"] }
clap_complete = { version = "4.6", optional = true }
dirs = "6.0"
globset = "0.4"
getrandom = "0.4"
hkdf = "0.13"
if-addrs = "0.15"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.11"
socket2 = { version = "0.6", features = ["all"] }
tempfile = "3.27"
unicode-normalization = "0.1"
walkdir = "2.5"
x25519-dalek = { version = "3.0", features = ["static_secrets"] }
zeroize = "1.9"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
cast_precision_loss = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
must_use_candidate = "allow"
needless_pass_by_value = "allow"
too_many_lines = "allow"
trivially_copy_pass_by_ref = "allow"

[workspace]
members = ["desktop"]
default-members = ["."]
resolver = "2"

[features]
default = ["cli"]
cli = ["dep:clap", "dep:clap_complete"]

[[bin]]
name = "xfer"
path = "src/main.rs"
required-features = ["cli"]
